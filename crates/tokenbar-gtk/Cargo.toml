[package]
name = "tokenbar-gtk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI token usage & quota monitor for Linux (GTK4)"
publish = false

[[bin]]
name = "tokenbar-gtk"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
chrono = "0.4.45"
dirs = "6.0.0"
epoxy = "0.1.0"
glam = "0.33.2"
glow = "0.17.0"
gtk4 = { version = "0.11.4", features = ["v4_14"] }
ksni = { version = "0.3.5", features = ["blocking"] }
libloading = "0.9.0"
serde_json = "1.0.150"
tb_reports = { version = "0.1.0", path = "../tb_reports" }
tokscale-core = { version = "3.0.0", path = "../../vendor/tokscale-core" }

# `.deb` packaging (cargo-deb): run `cargo deb -p tokenbar-gtk` from the repo root.
[package.metadata.deb]
maintainer = "SoWiEee <sowieee@users.noreply.github.com>"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "gnome-shell-extension-appindicator"
extended-description = """
TokenBar sits in the system tray and shows what you're spending across 25+ AI
coding agents (Claude Code, Codex, Cursor, OpenCode, Gemini CLI and more), read
on-device from your local session logs. Native GTK4/libadwaita, with an
orbitable 3D contribution graph and per-model/agent/day/hour breakdowns.
The tray needs a StatusNotifier host (e.g. the GNOME AppIndicator extension)."""
assets = [
    ["target/release/tokenbar-gtk", "usr/bin/", "755"],
    ["assets/tokenbar-gtk.desktop", "usr/share/applications/", "644"],
]

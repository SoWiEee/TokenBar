[package]
name = "tb_reports"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
tokscale-core = { path = "../../vendor/tokscale-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
chrono = "0.4"
dirs = "5"
rayon = "1.10"
